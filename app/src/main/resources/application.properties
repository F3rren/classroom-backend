# ============================================================================
# CONFIGURAZIONE BASE - valida in OGNI ambiente.
#
# Le impostazioni che cambiano fra sviluppo e produzione stanno in
# application-dev.properties e application-prod.properties.
# Il profilo predefinito e' "dev" (vedi in fondo).
# ============================================================================

spring.application.name=Prenotazioni Aule Backend

# Importa i SEGRETI da un file fuori dal jar, non versionato: contiene
# spring.datasource.password e jwt.secret.
# Resta "optional:" di proposito: jwt.secret non ha un valore di default nel codice,
# quindi se il file manca l'avvio fallisce comunque, in modo esplicito. Renderlo
# obbligatorio aggiungerebbe un secondo modo di fallire senza aggiungere sicurezza,
# e impedirebbe i deploy che passano tutto da variabili d'ambiente.
#
# REGOLA: questo file deve contenere SOLO segreti. Aggiungerci per esempio un
# spring.datasource.url reintrodurrebbe un'ambiguita' di precedenza fra file di
# configurazione difficile da ragionare.
#
# Due percorsi e non uno: con la struttura multi-modulo la working directory cambia a
# seconda di come si avvia. "mvn spring-boot:run -pl app" parte dentro app/, quindi vede
# ../config/; un "java -jar" lanciato dalla radice vede ./config/. Entrambi optional,
# quindi il percorso che non esiste viene semplicemente ignorato.
spring.config.import=optional:file:./config/config.properties,optional:file:../config/config.properties

# Percorsi raggiungibili senza token. Prima erano una lista dentro SecurityConfig;
# ora la configurazione di sicurezza e' condivisa fra i servizi e ognuno dichiara i suoi.
prenotazioni.security.public-paths=/api/auth/login,/auth/login,/v3/api-docs,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# ============================================
# JPA / HIBERNATE
# ============================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Chiude la sessione al termine del service invece di tenerla aperta durante la
# serializzazione della risposta.
spring.jpa.open-in-view=false

# INVARIANTE: mai "update", in nessun profilo. Lo schema e' di competenza di Flyway;
# Hibernate si limita a verificare che le entity corrispondano alle tabelle.
spring.jpa.hibernate.ddl-auto=validate

# ============================================
# MIGRAZIONI SCHEMA (Flyway)
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Le baseline-* NON stanno qui: sono una proprieta' del singolo database, non
# dell'applicazione. Vedi application-dev.properties.

# ============================================
# LOG (livelli tecnici, uguali ovunque)
# ============================================
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.type=OFF
logging.level.org.springframework.transaction=WARN

# ============================================
# ENCODING E RISORSE STATICHE
# ============================================
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ============================================
# PROFILO PREDEFINITO
# ============================================
# Cosi' "mvn spring-boot:run" e "java -jar" continuano a funzionare come prima.
# La produzione attiva esplicitamente: SPRING_PROFILES_ACTIVE=prod
#
# ATTENZIONE: un futuro @SpringBootTest scritto SENZA @ActiveProfiles erediterebbe
# "dev" e punterebbe al database locale dello sviluppatore. Oggi non puo' accadere:
# tutte le classi di test dichiarano il proprio profilo.
spring.profiles.default=dev
