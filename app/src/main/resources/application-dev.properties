# ============================================================================
# PROFILO DI SVILUPPO (predefinito)
# ============================================================================

# Database locale. La password arriva da .env (SPRING_DATASOURCE_PASSWORD).
spring.datasource.url=jdbc:postgresql://localhost:5432/prenotazione_aule
spring.datasource.username=postgres

# Il database di sviluppo esisteva PRIMA dell'introduzione di Flyway, con le tabelle
# create da Hibernate: baseline lo marca alla V1 senza rieseguirla.
#
# Sono impostazioni di QUESTO database, non dell'applicazione: su un database nuovo
# devono valere false, altrimenti una tabella spuria basterebbe a far marcare la V1
# come gia' applicata, saltando la creazione del vincolo anti-sovrapposizione.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema preesistente creato da Hibernate

server.port=${APP_PORT:17103}

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

logging.level.root=WARN
logging.level.com.prenotazioni=INFO
logging.file.name=logs/application.log

prenotazioni.cors.allowed-origins=http://localhost:3000,http://localhost:5173
prenotazioni.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
prenotazioni.cors.allowed-headers=*
prenotazioni.cors.allow-credentials=true
prenotazioni.cors.max-age=3600

# Pool piccolo: in sviluppo c'e' un solo utente.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# In sviluppo il bundle del frontend cambia a ogni build: un anno di cache sarebbe
# una trappola, con il browser che continua a servire la versione vecchia.
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.cache-public=false
