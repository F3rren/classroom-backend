spring.datasource.url=jdbc:mysql://localhost:3306/prenotazioni_aule?useSSL=false&serverTimezone=UTC
allowPublicKeyRetrieval=true&spring.datasource.username=root
spring.datasource.password=root
spring.datasource.url=jdbc:mysql://localhost:3306/prenotazioni_aule?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Abilita CORS globale
prenotazioni.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# Configurazioni logging
logging.level.root=INFO
logging.level.com.prenotazioni=INFO

# Logging per le query SQL (utile per debugging)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging per Spring Security (decommentare se necessario)
# logging.level.org.springframework.security=DEBUG

# Logging per transazioni database
logging.level.org.springframework.transaction=DEBUG

# Logging pattern personalizzato per console (opzionale)
# logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Configurazioni file log (già gestite da logback-spring.xml)
# logging.file.name=logs/application.log
# logging.level.org.springframework.web=DEBUG
