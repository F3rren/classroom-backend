# Continuous integration.
#
# The reason this file exists: the suite has three levels (unit tests with Mockito,
# integration on H2, and the constraint classes against a real PostgreSQL through
# Testcontainers) but the third only runs if the machine has Docker up. Without Docker those
# classes are skipped and the build stays GREEN: that really happened, and when they were
# finally executed they were hiding four failed assertions.
#
# On the ubuntu-latest runners Docker is always there, so the constraints are checked here on
# every push. The "Check that..." step turns a silent skip into an error.
#
# THE PRINCIPLE: there are no hand-written lists of modules or classes in this file. There
# were, and they went stale: the workflow knew three modules out of five and only one of the
# two Testcontainers classes. Everything that can be discovered is discovered, so that adding
# a module does not require remembering to come back here.

name: CI

on:
  push:
    # develop and not just main: it is the branch the work happens on. Without it this
    # workflow is decorative - as it had been until now, with nobody noticing.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 30 and not 20: there are five modules, the Maven cache is empty on the first run, and
    # some classes pull Docker images.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # A module with both application.properties AND application.yml in the same folder
      # raises no error: Spring loads BOTH, and .properties wins. Whoever has just written the
      # .yml sees it ignored with nothing to tell them - and looks for the defect in the code,
      # not in the file next door.
      #
      # It is the concrete way the rule "properties everywhere, yml only for nested lists" can
      # break: not by being broken openly, but by being followed halfway.
      - name: No module with two configuration formats
        run: |
          duplicates=0
          for dir in $(find . -path '*/src/*/resources' -type d -not -path '*/target/*'); do
            for properties in "$dir"/application*.properties; do
              [ -f "$properties" ] || continue
              base="${properties%.properties}"
              for yaml in "$base.yml" "$base.yaml"; do
                if [ -f "$yaml" ]; then
                  echo "::error::$properties and $yaml live side by side: Spring loads both, and"
                  echo "  .properties wins. The .yml ends up ignored with no signal at all."
                  duplicates=$((duplicates + 1))
                fi
              done
            done
          done
          if [ "$duplicates" -gt 0 ]; then exit 1; fi
          echo "OK: no module declares the same configuration in two formats."

      # verify and not test: it is the phase where the JaCoCo gate runs, applied per module.
      # No secrets to inject: .env is imported as "optional:" and does not exist on the
      # runner, while the test and pgtest profiles bring their own jwt.secret, CORS origins
      # and rate limit.
      - name: Build, test and coverage gate
        run: mvn -B clean verify

      # A "BUILD SUCCESS" is not enough: it would pass with those classes skipped too.
      - name: Check that the tests against real services actually ran
        run: |
          # The classes that depend on Docker are found by reading the sources, not from a
          # list: a list goes stale, and that has already happened once.
          checked=0
          problems=0

          # Neither a list nor a fixed depth: "*/src/test" went stale the moment the
          # services moved under services/, and "*/*/src/test" would go stale at the next
          # restructuring. The module is derived by cutting the fixed part of the path, which
          # does not depend on how deeply it is nested.
          for src in $(grep -rl "@Testcontainers" --include=*.java --exclude-dir=target . | sed 's|^\./||'); do
            module="${src%%/src/test/*}"
            class_name="$(basename "$src" .java)"
            package_name="$(sed -n 's/^package \(.*\);/\1/p' "$src" | head -1)"
            report="$module/target/surefire-reports/TEST-$package_name.$class_name.xml"

            if [ ! -f "$report" ]; then
              echo "::error::$class_name produced no report: it did not run."
              echo "  Expected at $report"
              echo "  If the class was renamed to *IT, surefire no longer picks it up."
              problems=$((problems + 1))
              continue
            fi
            if ! grep -q 'skipped="0"' "$report"; then
              echo "::error::$class_name was skipped: Testcontainers did not reach Docker."
              grep -oE 'tests="[0-9]+"|skipped="[0-9]+"' "$report" | head -2
              problems=$((problems + 1))
              continue
            fi
            if grep -q 'tests="0"' "$report"; then
              echo "::error::$class_name contains no tests."
              problems=$((problems + 1))
              continue
            fi
            echo "  ok: $module/$class_name"
            checked=$((checked + 1))
          done

          # A discovery that finds nothing would pass in silence, which is the same defect
          # in disguise once more: if the grep stopped finding the classes, this step would
          # say "all good" without having looked at anything.
          if [ "$checked" -eq 0 ] && [ "$problems" -eq 0 ]; then
            echo "::error::No @Testcontainers class found: the search no longer works."
            exit 1
          fi
          if [ "$problems" -gt 0 ]; then
            exit 1
          fi
          echo "OK: $checked classes ran against real services in containers."

      - name: Coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          # A glob and not a list, for the same reason as the step above. The aggregator has
          # no target directory and simply does not match.
          path: '**/target/site/jacoco/'
          if-no-files-found: warn

      - name: Failed test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: warn
