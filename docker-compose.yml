# ============================================================================
# The whole system with one command:
#
#     JWT_SECRET=$(openssl rand -base64 48) docker compose up --build
#
# The frontend then points at http://localhost:17102 and nothing else.
#
# ONE DATABASE PER SERVICE, rather than one with three schemas: that is the point of the
# split. Each service can reach only its own, so a query that crosses the boundary does not
# fail at runtime - it does not compile at all.
# ============================================================================

name: classroom

x-attesa-db: &attesa-db
  condition: service_healthy

services:

  db-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classroom_users
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - data-users:/var/lib/postgresql/data
    healthcheck:
      # The services start faster than PostgreSQL: without this check they would fail at
      # startup with "connection refused" and go into a restart loop.
      test: ["CMD-SHELL", "pg_isready -U postgres -d classroom_users"]
      interval: 5s
      retries: 12

  db-bookings:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classroom
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - data-bookings:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d classroom"]
      interval: 5s
      retries: 12

  db-notifications:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classroom_notifications
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - data-notifications:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d classroom_notifications"]
      interval: 5s
      retries: 12

  broker:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - data-broker:/var/lib/rabbitmq
    healthcheck:
      # Same reason as the databases: the services start before the broker, and without
      # this check they would go into a restart loop on their first attempt.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      retries: 12

  auth-service:
    build:
      context: .
      args:
        MODULE: auth-service
    depends_on:
      db-users: *attesa-db
    environment:
      # prod holds hardening ONLY - Swagger off, a wider pool, CORS with no fallback.
      # Without this line the service still starts, merely less protected: that is
      # deliberate, so that forgetting it degrades rather than breaks.
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db-users
      DB_NAME: classroom_users
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      # The SAME secret for all of them: that is what lets every service verify on its own
      # the tokens this one signs, without calling it.
      JWT_SECRET: "${JWT_SECRET:?generate one with: openssl rand -base64 48}"
      NOTIFICATION_SERVICE_URL: http://notification-service:17104
      BOOKING_SERVICE_URL: http://booking-service:17103
      # The first administrator, used ONLY if the users table is empty. Without it, on a new
      # database there would be no way to create one: /api/admin/users already requires an
      # administrator token. The empty defaults leave the mechanism inert for anybody who does
      # not want it, instead of forcing the variables to be declared in .env.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Amministratore}

  booking-service:
    build:
      context: .
      args:
        MODULE: booking-service
    depends_on:
      broker:
        condition: service_healthy
      db-bookings: *attesa-db
    environment:
      # prod holds hardening ONLY, as for the other two. It is no longer a necessity: the
      # connection lives in application.properties with placeholders, so without this line the
      # service still starts, merely less protected.
      #
      # It was not always so, and that cost dearly: the URL lived only in
      # application-dev.properties, written against localhost, and with
      # spring.profiles.default=dev a container without this line started pointing at
      # localhost and died on its first query. The symptom was a 503 from the gateway, and
      # the cause sat three files away.
      SPRING_PROFILES_ACTIVE: prod
      # This is the only service whose prod profile demands the CORS origins with no
      # fallback, so they have to be passed explicitly here.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      DB_HOST: db-bookings
      RABBITMQ_HOST: broker
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      DB_NAME: classroom
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: "${JWT_SECRET:?generate one with: openssl rand -base64 48}"
      NOTIFICATION_SERVICE_URL: http://notification-service:17104

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    depends_on:
      broker:
        condition: service_healthy
      db-notifications: *attesa-db
    environment:
      # prod holds hardening ONLY - Swagger off, a wider pool, CORS with no fallback.
      # Without this line the service still starts, merely less protected: that is
      # deliberate, so that forgetting it degrades rather than breaks.
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db-notifications
      RABBITMQ_HOST: broker
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      DB_NAME: classroom_notifications
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: "${JWT_SECRET:?generate one with: openssl rand -base64 48}"

  gateway:
    build:
      context: .
      args:
        MODULE: gateway
    # The only published port. The other services talk to each other on compose's internal
    # network and are not reachable from outside: the /internal/ routes are therefore
    # unreachable from outside by construction, and not merely by rule.
    ports:
      - "17102:17102"
    depends_on:
      - auth-service
      - booking-service
      - notification-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:17105
      BOOKING_SERVICE_URL: http://booking-service:17103
      NOTIFICATION_SERVICE_URL: http://notification-service:17104
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}

volumes:
  data-broker:
  data-users:
  data-bookings:
  data-notifications:
