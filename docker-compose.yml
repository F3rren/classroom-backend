# ============================================================================
# L'intero sistema con un comando:
#
#     JWT_SECRET=$(openssl rand -base64 48) docker compose up --build
#
# Poi il frontend punta a http://localhost:17102 e nient'altro.
#
# UN DATABASE PER SERVIZIO, e non uno con tre schemi: e' il punto della
# separazione. Ogni servizio puo' raggiungere solo il proprio, quindi una query
# che attraversa il confine non fallisce a runtime - non compila proprio.
# ============================================================================

name: prenotazioni-aule

x-attesa-db: &attesa-db
  condition: service_healthy

services:

  db-utenti:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prenotazione_aule_utenti
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - dati-utenti:/var/lib/postgresql/data
    healthcheck:
      # I servizi partono piu' in fretta di PostgreSQL: senza questo controllo
      # fallirebbero all'avvio con "connection refused" e andrebbero in restart loop.
      test: ["CMD-SHELL", "pg_isready -U postgres -d prenotazione_aule_utenti"]
      interval: 5s
      retries: 12

  db-prenotazioni:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prenotazione_aule
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - dati-prenotazioni:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prenotazione_aule"]
      interval: 5s
      retries: 12

  db-notifiche:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: prenotazione_aule_notifiche
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - dati-notifiche:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prenotazione_aule_notifiche"]
      interval: 5s
      retries: 12

  broker:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - dati-broker:/var/lib/rabbitmq
    healthcheck:
      # Stessa ragione dei database: i servizi partono prima del broker e senza
      # questo controllo entrerebbero in restart loop al primo tentativo.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      retries: 12

  auth-service:
    build:
      context: .
      args:
        MODULO: auth-service
    depends_on:
      db-utenti: *attesa-db
    environment:
      # prod contiene SOLO irrobustimento - Swagger spento, pool piu' largo, CORS
      # senza ripiego. Senza questa riga il servizio parte lo stesso, solo meno
      # protetto: e' voluto, cosi' dimenticarla degrada invece di rompere.
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db-utenti
      DB_NAME: prenotazione_aule_utenti
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      # Lo STESSO segreto per tutti: e' cio' che permette a ogni servizio di
      # verificare da solo i token che questo firma, senza chiamarlo.
      JWT_SECRET: "${JWT_SECRET:?generane uno con openssl rand -base64 48}"
      NOTIFICA_SERVICE_URL: http://notifica-service:17104
      PRENOTAZIONE_SERVICE_URL: http://prenotazione-service:17103
      # Primo amministratore, usato SOLO se la tabella utenti e' vuota. Senza, su un
      # database nuovo non ci sarebbe modo di crearne uno: /api/admin/users richiede
      # gia' un token da amministratore. I default vuoti rendono il meccanismo inattivo
      # per chi non lo vuole, invece di obbligare a dichiarare le variabili in .env.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NOME: ${BOOTSTRAP_ADMIN_NOME:-Amministratore}

  prenotazione-service:
    build:
      context: .
      args:
        MODULO: prenotazione-service
    depends_on:
      broker:
        condition: service_healthy
      db-prenotazioni: *attesa-db
    environment:
      # prod contiene SOLO irrobustimento, come per gli altri due. Non e' piu' una
      # necessita': la connessione sta in application.properties con i segnaposto, quindi
      # senza questa riga il servizio parte lo stesso, solo meno protetto.
      #
      # Prima non era cosi', ed e' costato caro: l'URL viveva solo in
      # application-dev.properties, scritto su localhost, e con spring.profiles.default=dev
      # un container senza questa riga partiva puntando a localhost e moriva alla prima
      # query. Il sintomo era un 503 dal gateway, e la causa tre file piu' in la'.
      SPRING_PROFILES_ACTIVE: prod
      # Questo servizio e' l'unico il cui prod pretende le origini CORS senza ripiego,
      # quindi qui vanno passate esplicitamente.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      DB_HOST: db-prenotazioni
      RABBITMQ_HOST: broker
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      DB_NAME: prenotazione_aule
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: "${JWT_SECRET:?generane uno con openssl rand -base64 48}"
      NOTIFICA_SERVICE_URL: http://notifica-service:17104

  notifica-service:
    build:
      context: .
      args:
        MODULO: notifica-service
    depends_on:
      broker:
        condition: service_healthy
      db-notifiche: *attesa-db
    environment:
      # prod contiene SOLO irrobustimento - Swagger spento, pool piu' largo, CORS
      # senza ripiego. Senza questa riga il servizio parte lo stesso, solo meno
      # protetto: e' voluto, cosi' dimenticarla degrada invece di rompere.
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db-notifiche
      RABBITMQ_HOST: broker
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      DB_NAME: prenotazione_aule_notifiche
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: "${JWT_SECRET:?generane uno con openssl rand -base64 48}"

  gateway:
    build:
      context: .
      args:
        MODULO: gateway
    # L'unica porta pubblicata. Gli altri servizi si parlano sulla rete interna
    # di compose e non sono raggiungibili da fuori: le rotte /interne/ restano
    # cosi' irraggiungibili dall'esterno per costruzione, non solo per regola.
    ports:
      - "17102:17102"
    depends_on:
      - auth-service
      - prenotazione-service
      - notifica-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:17105
      PRENOTAZIONE_SERVICE_URL: http://prenotazione-service:17103
      NOTIFICA_SERVICE_URL: http://notifica-service:17104
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}

volumes:
  dati-broker:
  dati-utenti:
  dati-prenotazioni:
  dati-notifiche:
