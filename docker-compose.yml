# ============================================================================
# The whole system with one command:
#
#     JWT_SECRET=$(openssl rand -base64 48) docker compose up --build
#
# The frontend then points at http://localhost:17102 and nothing else.
#
# ONE DATABASE PER SERVICE, rather than one with three schemas: that is the point of the
# split. Each service can reach only its own, so a query that crosses the boundary does not
# fail at runtime - it does not compile at all.
# ============================================================================

name: classroom

x-attesa-db: &attesa-db
  condition: service_healthy

services:

  db-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classroom_users
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - data-users:/var/lib/postgresql/data
    healthcheck:
      # The services start faster than PostgreSQL: without this check they would fail at
      # startup with "connection refused" and go into a restart loop.
      test: ["CMD-SHELL", "pg_isready -U postgres -d classroom_users"]
      interval: 5s
      retries: 12

  db-bookings:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classroom
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - data-bookings:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d classroom"]
      interval: 5s
      retries: 12

  db-notifications:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: classroom_notifications
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - data-notifications:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d classroom_notifications"]
      interval: 5s
      retries: 12

  broker:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - data-broker:/var/lib/rabbitmq
    healthcheck:
      # Same reason as the databases: the services start before the broker, and without
      # this check they would go into a restart loop on their first attempt.
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      retries: 12

  auth-service:
    build:
      context: .
      args:
        MODULE: auth-service
    depends_on:
      broker:
        condition: service_healthy
      db-users: *attesa-db
    environment:
      # Stays on "prod" (the service's own default - application.properties). Swagger is
      # turned on with the two SPRINGDOC_* flags below instead of switching the whole profile
      # to "dev": "dev" also turns on the file log appender in logback-spring.xml, which has
      # no writable place to go inside the container and crashes startup on its own - the
      # exact failure this compose file used to hit before these two flags existed.
      SPRINGDOC_API_DOCS_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
      DB_HOST: db-users
      RABBITMQ_HOST: broker
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      DB_NAME: classroom_users
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      # The SAME secret for all of them: that is what lets every service verify on its own
      # the tokens this one signs, without calling it.
      JWT_SECRET: "${JWT_SECRET:?generate one with: openssl rand -base64 48}"
      # The first administrator, used ONLY if the users table is empty. Without it, on a new
      # database there would be no way to create one: /api/admin/users already requires an
      # administrator token. The empty defaults leave the mechanism inert for anybody who does
      # not want it, instead of forcing the variables to be declared in .env.
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Amministratore}

  booking-service:
    build:
      context: .
      args:
        MODULE: booking-service
    depends_on:
      broker:
        condition: service_healthy
      db-bookings: *attesa-db
    environment:
      # Stays on "prod" (the service's own default), for the same reason as the other two:
      # switching the whole profile to "dev" would also turn on the file log appender in
      # logback-spring.xml, with no writable place to go inside the container, AND the Flyway
      # baseline flags meant for one developer's pre-Flyway local database
      # (application-dev.properties) - neither belongs here. Swagger comes on with the two
      # SPRINGDOC_* flags below instead.
      SPRINGDOC_API_DOCS_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
      # prod has no fallback for this one (application-prod.properties): a real deployment is
      # forced to set it for real rather than inherit a development value by accident.
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}"
      DB_HOST: db-bookings
      RABBITMQ_HOST: broker
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      DB_NAME: classroom
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: "${JWT_SECRET:?generate one with: openssl rand -base64 48}"
      NOTIFICATION_SERVICE_URL: http://notification-service:17104

  notification-service:
    build:
      context: .
      args:
        MODULE: notification-service
    depends_on:
      broker:
        condition: service_healthy
      db-notifications: *attesa-db
    environment:
      # Stays on "prod" (the service's own default - application.properties). Swagger is
      # turned on with the two SPRINGDOC_* flags below instead of switching the whole profile
      # to "dev": "dev" also turns on the file log appender in logback-spring.xml, which has
      # no writable place to go inside the container and crashes startup on its own - the
      # exact failure this compose file used to hit before these two flags existed.
      SPRINGDOC_API_DOCS_ENABLED: "true"
      SPRINGDOC_SWAGGER_UI_ENABLED: "true"
      DB_HOST: db-notifications
      RABBITMQ_HOST: broker
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      DB_NAME: classroom_notifications
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      JWT_SECRET: "${JWT_SECRET:?generate one with: openssl rand -base64 48}"

  gateway:
    build:
      context: .
      args:
        MODULE: gateway
    # The only published port. The other services talk to each other on compose's internal
    # network and are not reachable from outside: the /internal/ routes are therefore
    # unreachable from outside by construction, and not merely by rule.
    ports:
      - "17102:17102"
    depends_on:
      - auth-service
      - booking-service
      - notification-service
    environment:
      AUTH_SERVICE_URL: http://auth-service:17105
      BOOKING_SERVICE_URL: http://booking-service:17103
      NOTIFICATION_SERVICE_URL: http://notification-service:17104
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      # Off by default in application.yml; on here because the three services above have
      # their own SPRINGDOC_*_ENABLED flags set too. Aggregates their /v3/api-docs into one
      # Swagger UI, on the one port that matters: http://localhost:17102/swagger-ui.html.
      SWAGGER_UI_ENABLED: "true"

volumes:
  data-broker:
  data-users:
  data-bookings:
  data-notifications:
