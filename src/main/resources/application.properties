# ============================================
# IMPORTA CONFIGURAZIONI ESTERNE
# ============================================
# Questo file importa le credenziali dal file config/config.properties
# che si trova FUORI dal JAR e può essere modificato senza ricompilare
spring.config.import=optional:file:./config/config.properties

# ============================================
# CONFIGURAZIONI GENERALI APPLICAZIONE
# ============================================
# Queste sono le configurazioni di default che vanno bene per tutti gli ambienti
# Possono essere sovrascritte da config/config.properties

# JPA/Hibernate - Configurazione ORM
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Chiude la sessione al termine del service invece di tenerla aperta durante la
# serializzazione della risposta. Senza, Spring logga un WARN a ogni avvio e le query
# lazy possono partire fuori dal service, dove non c'e' piu' una transazione esplicita.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool - Ottimizzazione connessioni database
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ============================================
# CONFIGURAZIONI LOGGING
# ============================================
# Livelli di log per l'applicazione
logging.level.root=WARN

# Disabilita completamente i log di Hibernate
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.type=OFF

# Mantieni solo i log dell'applicazione.
# A INFO restano gli eventi di business (login, prenotazioni, azioni admin) e le anomalie;
# il tracciamento di flusso INIZIO/FINE e' a DEBUG, alzabile solo quando serve indagare.
logging.level.com.prenotazioni=INFO

# Transazioni a WARN: a DEBUG produceva righe per ogni begin/commit di ogni richiesta,
# utile solo mentre si indaga un problema transazionale specifico.
logging.level.org.springframework.transaction=WARN

# File di log (cartella logs generata automaticamente)
logging.file.name=logs/application.log

# ============================================
# CONFIGURAZIONI SPRING BOOT
# ============================================
# Nome dell'applicazione
spring.application.name=Prenotazioni Aule Backend

# Encoding
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ============================================
# DATABASE - SVILUPPO (Locale)
# ============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/prenotazione_aule
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
# Password del DB spostata in config/config.properties (gitignored, vedi spring.config.import sotto)

# JPA/Hibernate - Configurazione per sviluppo
# validate e non update: lo schema e' ora di competenza di Flyway. Hibernate si limita
# a verificare che le entity corrispondano alle tabelle e fallisce all'avvio se divergono,
# invece di modificare silenziosamente il database.
spring.jpa.hibernate.ddl-auto=validate

# ============================================
# MIGRAZIONI SCHEMA (Flyway)
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Il database di sviluppo esiste gia' con le tabelle create da Hibernate: baseline-on-migrate
# lo marca alla versione 1 senza rieseguire V1, e applica solo da V2 in poi. Su un database
# nuovo e vuoto vengono invece eseguite tutte le migrazioni dalla V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema preesistente creato da Hibernate
# show-sql scrive ogni query su stdout scavalcando il sistema di logging (niente livelli,
# niente file): il risultato era che le query sommergevano i log applicativi. Per vedere
# l'SQL quando serve: logging.level.org.hibernate.SQL=DEBUG in config/config.properties.
spring.jpa.show-sql=false
# ============================================
# SERVER - SVILUPPO
# ============================================
server.port=8080

# ============================================
# CONFIGURAZIONI JWT - SVILUPPO
# ============================================
# Segreto per la firma dei token JWT - definito in config/config.properties (gitignored, vedi spring.config.import sopra).
# Nessun default qui di proposito: se manca, l'avvio fallisce esplicitamente invece di usare un segreto noto/committato.

# ============================================
# CORS - SVILUPPO
# ============================================
prenotazioni.cors.allowed-origins=http://localhost:3000,http://localhost:5173,
prenotazioni.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
prenotazioni.cors.allowed-headers=*
prenotazioni.cors.allow-credentials=true
prenotazioni.cors.max-age=3600

# ============================================
# DEVTOOLS - SVILUPPO
# ============================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true


# ===== CONFIGURAZIONE FILE STATICI =====
# Serve file statici dalla cartella /static
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Cache per file statici (1 anno)
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Compressione GZIP
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024