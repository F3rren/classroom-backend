# Profilo di test: H2 in-memory, nessuna dipendenza da Postgres in esecuzione
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

jwt.secret=dGVzdC1zZWNyZXQtbm9uLXVzYXJlLWluLXByb2R1emlvbmUtc29sby1wZXItaS10ZXN0LWF1dG9tYXRpY2k

# Rate limit login alzato nei test: molti test fanno login ripetuti sugli stessi 2 utenti
# nella stessa finestra temporale; il comportamento del limiter stesso e' testato altrove.
auth.rate-limit.max-attempts=1000

prenotazioni.cors.allowed-origins=http://localhost:3000
prenotazioni.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
prenotazioni.cors.allowed-headers=*
prenotazioni.cors.allow-credentials=true
prenotazioni.cors.max-age=3600

logging.level.root=WARN
