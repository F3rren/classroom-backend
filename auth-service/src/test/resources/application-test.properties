# ============================================================================
# Profilo di test del servizio notifiche.
#
# H2 in memoria: veloce e sufficiente, perche' questo servizio non usa nulla che
# H2 non sappia esprimere (nessun vincolo di esclusione, nessun tipo range).
#
# Flyway e' disattivato e lo schema lo genera Hibernate: le migrazioni sono scritte
# in dialetto PostgreSQL. E' la stessa scelta gia' fatta nel monolite.
# ============================================================================

spring.datasource.url=jdbc:h2:mem:notifiche;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# DEVE coincidere con TestJwt.SEGRETO_DI_TEST: e' cio' che rende validi qui i token
# che i test si firmano da soli. Se i due divergono ogni richiesta risponde 401.
jwt.secret=dGVzdC1zZWNyZXQtcGVyLWktdGVzdC1kaS1pbnRlZ3JhemlvbmUtMDAxMg

prenotazioni.cors.allowed-origins=http://localhost:3000
prenotazioni.security.public-paths=/api/auth/login,/v3/api-docs,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# Svuotare l'import: i test portano i propri segreti (jwt.secret qui sopra) e non
# devono leggere .env, che sulla macchina di chi sviluppa contiene valori veri.
spring.config.import=

# Soglia alzata: la fixture di ogni test fa due login dallo stesso indirizzo, e il
# rate limiter anti brute-force li conterebbe come tentativi sospetti. Il limite
# reale resta quello della configurazione principale, ed e' verificato a parte.
auth.rate-limit.max-attempts=1000
