# ============================================================================
# SERVIZIO UTENTI
#
# Database proprio: e' il punto della separazione. Nessun altro servizio legge o
# scrive la tabella utenti, e questo servizio non vede aule, prenotazioni o notifiche.
# ============================================================================

spring.application.name=Utenti

server.port=${AUTH_PORT:17105}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prenotazione_aule_utenti}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# I segreti stanno fuori dal repository, come nel monolite. jwt.secret DEVE essere lo
# stesso degli altri servizi: e' cio' che permette a questo servizio di validare da solo
# i token emessi da auth-service, senza chiamarlo.
spring.config.import=optional:file:./config/config.properties,optional:file:../config/config.properties

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Mai update: lo schema lo fa Flyway, Hibernate si limita a verificare che le entita'
# corrispondano e fallisce all'avvio se divergono.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Questo servizio non ha rotte pubbliche oltre alla documentazione: non emette token
# e non ha un login. Il default di SecurityConfig basterebbe, ma dichiararlo rende
# esplicito che l'omissione non e' una dimenticanza.
# /api/auth/login deve restare pubblico: e' l'unico modo di ottenere un token.
prenotazioni.security.public-paths=/api/auth/login,/v3/api-docs,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

prenotazioni.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging.level.root=INFO
logging.level.com.prenotazioni=DEBUG

# Indirizzi dei servizi da avvisare quando un utente viene eliminato.
prenotazioni.notifica-service.url=${NOTIFICA_SERVICE_URL:http://localhost:17104}
prenotazioni.booking-service.url=${BOOKING_SERVICE_URL:http://localhost:17103}
