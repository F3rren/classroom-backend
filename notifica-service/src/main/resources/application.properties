# ============================================================================
# SERVIZIO NOTIFICHE
#
# Database proprio: e' il punto della separazione. Nessun altro servizio legge o
# scrive la tabella notifiche, e questo servizio non vede utenti, aule o prenotazioni.
# ============================================================================

spring.application.name=Notifiche

server.port=${NOTIFICA_PORT:17104}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prenotazione_aule_notifiche}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# I segreti stanno in .env, l'unico file che li contiene e l'unico ignorato da git: lo
# legge Docker Compose per i container e Spring - da qui - per i lanci fuori dai container.
# "optional:" perche' in container il file non esiste, i valori arrivano gia' come
# variabili d'ambiente. Spiegazione estesa in auth-service/src/main/resources.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Il ponte fra i nomi di .env e quelli di Spring: la conversione non e' automatica per le
# chiavi lette da un file. jwt.secret DEVE valere lo stesso degli altri servizi - e' cio'
# che permette a questo servizio di validare da solo i token emessi da auth-service,
# senza chiamarlo - ed e' senza ripiego apposta: meglio non partire che validare a vuoto.
jwt.secret=${JWT_SECRET}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Mai update: lo schema lo fa Flyway, Hibernate si limita a verificare che le entita'
# corrispondano e fallisce all'avvio se divergono.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Questo servizio non ha rotte pubbliche oltre alla documentazione: non emette token
# e non ha un login. Il default di SecurityConfig basterebbe, ma dichiararlo rende
# esplicito che l'omissione non e' una dimenticanza.
prenotazioni.security.public-paths=/v3/api-docs,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

prenotazioni.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging.level.root=INFO
logging.level.com.prenotazioni=DEBUG

# ============================================================================
# BROKER
# La notifica di cancellazione viaggia su coda: cosi' non si perde se il servizio
# notifiche e' spento. Restano sincrone le chiamate in cui il chiamante DEVE
# sapere l'esito, come la cancellazione dei dati di un utente.
# ============================================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
