# ============================================================================
# THE DEVELOPMENT PROFILE — THE GATEWAY
#
#     SPRING_PROFILES_ACTIVE=dev          outside a container
#     SPRING_PROFILES_ACTIVE=dev,docker   what docker-compose.yml sets
#
# The gateway has no application-prod.yml to be the mirror image of: everything in
# application.yml is already true in every environment, and the one thing that was not - the
# documentation - was being decided by an environment variable that docker-compose.yml had to
# remember to pass. It is decided here now, by the same profile that decides it for the three
# services behind it.
#
# There is no "docker" file for the gateway: nothing here depends on being in a container.
# It receives the profile all the same, so that the five containers are started the same way
# and the one exception does not have to be remembered.
# ============================================================================

# Both flags, not just swagger-ui: api-docs.enabled is springdoc's master switch, and with it
# off /swagger-ui.html 404s no matter what swagger-ui.enabled says, because the
# auto-configuration that serves the page never gets registered. application.yml explains the
# rest; what matters here is that the pair stays a pair.
#
# The variable is still read, so a development run can silence the documentation without
# leaving the profile - only its default is turned round.
springdoc:
  api-docs:
    enabled: ${SWAGGER_UI_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}

logging:
  level:
    # Which route matched, and which URI the request was rewritten to before being forwarded.
    # It is the question the gateway actually raises in development - a 404 that came from
    # here, or from the service behind it? - and the only place the answer exists.
    org.springframework.cloud.gateway: DEBUG
    com.classroom: DEBUG
