# ============================================================================
# GATEWAY
#
# Il frontend conosce questo indirizzo e nessun altro.
#
# PORTE. Il gateway occupa 17102, ed e' l'unica che il frontend deve conoscere. I
# servizi prendono le successive, in modo che aggiungerne uno non richieda di
# ripensare l'assegnazione:
#
#     17102  gateway            <-- il frontend parla solo con questa
#     17103  app                (aule, prenotazioni, corsi)
#     17104  notifica-service
#     17105  auth-service       (utenti, emissione dei token)
#
# La 8080 e' volutamente evitata: e' troppo comune e finisce per collidere con
# altri progetti sulla stessa macchina.
#
# Ogni porta resta sovrascrivibile da variabile d'ambiente, senza toccare codice.
# ============================================================================

server:
  port: ${GATEWAY_PORT:17102}

spring:
  application:
    name: Gateway

  cloud:
    gateway:
      # La CORS sta qui perche' e' il gateway a parlare col browser: i servizi dietro
      # ricevono solo richieste server-to-server. Ognuno mantiene comunque la propria
      # configurazione, che serve quando lo si interroga direttamente in sviluppo.
      # QUALE indirizzo arriva ai servizi come indirizzo del chiamante.
      #
      # Il default e' AGGIUNGERE in coda a un X-Forwarded-For gia' presente invece di
      # sostituirlo. Siccome ForwardedHeaderFilter, a valle, legge il PRIMO valore, quel
      # default lascia scegliere al chiamante il proprio indirizzo apparente: chi manda
      # "X-Forwarded-For: 9.9.9.9" fa arrivare "9.9.9.9,<indirizzo reale>" e viene letto
      # come 9.9.9.9.
      #
      # Non e' teorico: auth-service limita i tentativi di login su una chiave che comincia
      # con quell'indirizzo. Col default, cambiarlo a ogni richiesta evita del tutto il
      # limite. Con for-append: false il gateway scrive solo il proprio interlocutore
      # diretto e scarta cio' che il client dichiara.
      #
      # QUESTA RIGA E "server.forward-headers-strategy=framework" NEI TRE SERVIZI SI
      # REGGONO A VICENDA: la' ci si fida dell'intestazione, qui la si rende affidabile.
      # Togliendone una senza sapere dell'altra il buco si riapre in silenzio.
      # Fissata da IndirizzoDelChiamanteTest.
      #
      # Se un giorno davanti al gateway ci fosse un proxy vero, questa scelta va rifatta:
      # li' l'intestazione in arrivo sarebbe legittima e andrebbe conservata, fidandosi del
      # proxy - non del client.
      x-forwarded:
        for-append: false

      # Senza questi due, il gateway aspetta un servizio a valle SENZA LIMITE. Un servizio
      # spento e' gestito bene - la connessione viene rifiutata e si risponde 503 - ma un
      # servizio LENTO, che accetta la connessione e non risponde, tiene occupate le
      # risorse del gateway finche' non si arrende da solo. Ed essendo il gateway l'unico
      # ingresso, un servizio lento diventa un sistema lento.
      #
      # 10 secondi e' largo per queste API, dove la richiesta piu' pesante e' un elenco di
      # prenotazioni: se ci mette di piu' e' rotta, non lenta.
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS, PATCH]
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        # ------------------------------------------------------------------
        # PRIMA REGOLA, E L'ORDINE CONTA: le rotte interne di notifica-service
        # sono chiamate da altri servizi, non dal browser. Esporle attraverso il
        # gateway darebbe a chiunque abbia un token admin la possibilita' di
        # fabbricare notifiche arbitrarie. Spring Cloud Gateway valuta le rotte
        # nell'ordine dichiarato: questa deve precedere quella generica sulle
        # notifiche, altrimenti non verrebbe mai raggiunta.
        # ------------------------------------------------------------------
        # forward: e non un filtro SetStatus, che imposterebbe lo stato della risposta
        # ricevuta dal servizio a valle DOPO averlo interrogato: la richiesta arriverebbe
        # comunque. forward: la dirotta sul gateway stesso, che non ha alcun handler per
        # quel percorso e risponde 404 senza inoltrare nulla.
        - id: notifications-internal-blocked
          uri: forward:/route-not-exposed
          predicates:
            - Path=/api/notifications/internal/**

        # Anche le prenotazioni hanno rotte interne fra servizi: auth-service le chiama
        # per cancellare le prenotazioni di un utente rimosso. Stessa regola, stesso ordine.
        - id: bookings-internal-blocked
          uri: forward:/route-not-exposed
          predicates:
            - Path=/api/bookings/internal/**

        - id: notifications
          uri: ${NOTIFICA_SERVICE_URL:http://localhost:17104}
          predicates:
            - Path=/api/notifications/**

        # Login, profilo e amministrazione utenti: auth-service.
        - id: authentication
          uri: ${AUTH_SERVICE_URL:http://localhost:17105}
          predicates:
            # Un prefisso, non un elenco. Prima qui c'era la lista degli endpoint admin di
            # auth-service, copiata dal controller: aggiungerne uno la' senza toccare
            # questa riga lo avrebbe mandato a prenotazione-service, con un 404 e niente
            # che indicasse il perche'. Ora la rotta descrive un confine fra servizi.
            - Path=/api/auth/**,/api/me/**,/api/admin/users,/api/admin/users/**

        # Aule, prenotazioni e amministrazione delle stesse.
        - id: application
          uri: ${PRENOTAZIONE_SERVICE_URL:http://localhost:17103}
          predicates:
            - Path=/api/rooms/**,/api/bookings/**,/api/admin/**

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
