# ============================================================================
# THE "docker" PROFILE — THE BOOKING SERVICE
#
# It is never activated alone. docker-compose.yml sets SPRING_PROFILES_ACTIVE=dev,docker: the
# first says which behaviour is wanted, the second says WHERE it is running, and this file
# holds the short list of things that are true only in the second.
#
# The whole file is one line, and it is not a detail: it is the reason docker-compose.yml can
# afford to use the dev profile at all. Before this, switching the profile in a container was
# tried and reverted twice - once for the log file, fixed in logback-spring.xml, and once for
# what is below.
# ============================================================================

# application-dev.properties BASELINES: the developer's own database predates Flyway, and
# without baseline its first migration would fail on tables that are already there.
#
# A container's database is the opposite case: the volume is created empty and Flyway has to
# run V1 for real. Baselining it would mark V1 as already applied against a database that has
# nothing in it - the tables would never be created, and the first query would fail with the
# cause four files away.
#
# This wins because Spring applies profiles in the order they are listed, and "docker" comes
# after "dev".
spring.flyway.baseline-on-migrate=false
