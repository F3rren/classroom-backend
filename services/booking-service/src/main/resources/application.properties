# ============================================================================
# THE BASE CONFIGURATION - valid in EVERY environment.
#
# The settings that differ between development and production live in
# application-dev.properties and application-prod.properties.
# The default profile is "dev" (see the bottom of this file).
# ============================================================================

spring.application.name=Bookings

# Imports the SECRETS from .env, the only file that holds them and the only one git ignores.
# Two things read it: Docker Compose, to inject them into the containers, and Spring from
# here, for runs outside them. They used to be two separate files holding the same two keys
# under different names, kept in step by hand; when they drifted, the symptom was a service
# that started locally but not in a container, with nothing saying why.
#
# Compose's KEY=value format is also that of Java .properties files, and "[.properties]" is
# how you declare that to Spring. The compatibility of the two readers is pinned by
# EnvFormatUnitTest in shared, quotes included.
#
# It stays "optional:" on purpose: in a container the file is not there at all, because the
# values arrive as environment variables already. Making it mandatory would forbid exactly
# the way the stack runs today.
#
# THE RULE: .env holds ONLY secrets and environment parameters. Adding, say, a
# spring.datasource.url would reintroduce a precedence ambiguity between configuration files
# that is hard to reason about.
#
# Two paths and not one: with the multi-module layout the working directory changes with how
# you start. "mvn spring-boot:run -pl booking-service" starts inside booking-service/, so it
# sees ../.env; a "java -jar" launched from the root sees ./.env. Both optional, so the path
# that does not exist is simply ignored.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# The bridge between .env's names and Spring's. The conversion is not automatic: relaxed
# binding treats uppercase-with-underscores only for real environment variables, not for keys
# read from a file. These two placeholders resolve in both worlds - the environment variable
# in a container, the .env value locally.
#
# jwt.secret has no fallback on purpose: if it is missing, the service has to refuse to start
# rather than validate tokens against an empty key.
jwt.secret=${JWT_SECRET}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# The paths reachable without a token. They used to be a list inside SecurityConfig; the
# security configuration is now shared between the services, and each declares its own.
# This service exposes no login endpoint - that stays auth-service's alone - so unlike its
# public-paths, this one names only the API docs.
classroom.security.public-paths=/v3/api-docs,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# ============================================
# JPA / HIBERNATE
# ============================================
# THE CONNECTION. It lives here and not in the profiles, as in the other two services: the
# URL used to exist only in application-dev (with localhost written by hand) and in
# application-prod, and since spring.profiles.default=dev, a container without
# SPRING_PROFILES_ACTIVE started pointing at localhost and died on its first query. The
# symptom was a 503 from the gateway, and the cause sat three files away.
#
# With the placeholders here, forgetting the profile degrades instead of killing: you land on
# the development defaults, which is exactly what you expect when launching by hand.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:classroom}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Closes the session when the service returns, instead of holding it open while the response
# is serialised.
spring.jpa.open-in-view=false

# INVARIANT: never "update", in any profile. The schema is Flyway's business; Hibernate
# merely checks that the entities match the tables.
spring.jpa.hibernate.ddl-auto=validate

# ============================================
# SCHEMA MIGRATIONS (Flyway)
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# The baseline-* settings are NOT here: they are a property of one particular database, not
# of the application. See application-dev.properties.

# ============================================
# LOGGING (technical levels, the same everywhere)
# ============================================
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.type=OFF
logging.level.org.springframework.transaction=WARN

# ============================================
# ENCODING AND STATIC RESOURCES
# ============================================
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# No static resources: the frontend is an application of its own, served by its own server
# (the CORS origins point at the two development servers). This mattered when this was the
# monolith and the React SPA lived inside the jar; with the gateway in front, routing only
# /api/**, those paths were no longer reachable from outside.
#
# static-path-pattern=/** in particular mapped EVERY non-API path onto the static resources:
# leaving it with nothing to serve would mean keeping a handler alive that has nothing left
# to handle.
spring.web.resources.add-mappings=false

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ============================================
# THE DEFAULT PROFILE
# ============================================
# So that "mvn spring-boot:run" and "java -jar" keep working as they did.
# Production activates explicitly: SPRING_PROFILES_ACTIVE=prod
#
# CAREFUL: a future @SpringBootTest written WITHOUT @ActiveProfiles would inherit "dev" and
# point at the developer's local database. That cannot happen today: every test class
# declares its own profile.
spring.profiles.default=dev

# ============================================================================
# THE BROKER
# The cancellation notification travels on a queue, so it is not lost if the notification
# service is down. The calls where the caller MUST know the outcome stay synchronous, such as
# deleting a user's data.
# ============================================================================
server.port=${BOOKING_PORT:17103}

# CORS: the two most common development servers as a fallback. The prod profile overrides it
# with the form that has NO default, so in production forgetting the variable is a startup
# error rather than an opening towards localhost.
classroom.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
classroom.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
classroom.cors.allowed-headers=*
classroom.cors.allow-credentials=true
classroom.cors.max-age=3600

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# A UserDeletedEvent that UserDeletionListener cannot handle - unreachable database, violated
# constraint - is retried three times with growing backoff before the recoverer moves it to
# the error queue and acknowledges it, exactly as notification-service already does for the
# cancellation event.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s

# Behind the gateway the TCP connection comes from the gateway, not from the client: without
# this line getRemoteAddr() always returns the same address and every IP-based defence stops
# telling callers apart. The gateway already sends X-Forwarded-For; "framework" is what tells
# Spring to read it.
#
# Why it really matters: the login limiter's key is IP|email. With a constant IP anybody
# could exhaust the counter for somebody else's address and lock its owner out - six
# anonymous requests were enough. It was a regression introduced by the gateway: before it,
# requests reached the service directly.
#
# TRUSTING X-FORWARDED-FOR TAKES TWO THINGS, AND THIS IS ONLY ONE OF THEM.
#
# The first: the services are not reachable from outside, the only published port is the
# gateway's. If they ever were, this line would become the way to forge your own address.
#
# The second, which was missing: the gateway has to REPLACE the header, not append to it. Its
# default is to append, and since the first value is the one read here, the address was
# chosen by the caller - the login attempt limit was sidestepped by changing it on every
# request. It needs "spring.cloud.gateway.x-forwarded.for-append: false" in the gateway, and
# that is pinned by CallerAddressTest.
#
# The two lines hold each other up: removing one without knowing about the other reopens the
# hole with nothing to signal it.
server.forward-headers-strategy=framework
