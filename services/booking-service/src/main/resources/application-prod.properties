# ============================================================================
# THE PRODUCTION PROFILE
# This is now also the DEFAULT (see spring.profiles.default in application.properties):
# activating it explicitly with SPRING_PROFILES_ACTIVE=prod is documentation, not a
# requirement. SPRING_PROFILES_ACTIVE=dev is what opts OUT of it.
# ============================================================================

# The connection is NOT declared here: it lives in application.properties with the ${DB_HOST}
# placeholders and their companions, which take the real values in a container and fall back
# outside one to
# localhost. Repeating it here would mean keeping it in step across two files.
#
# THIS PROFILE HOLDS HARDENING ONLY: things that have to change outside development, not
# things without which the service does not start. It used to be the distinction that saved
# you when somebody forgot SPRING_PROFILES_ACTIVE; now forgetting it changes nothing, because
# this is what you get by default.

# No baseline in production: if the database has no Flyway history it has to migrate from V1,
# not be marked as already migrated.
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
# In Flyway 9 "clean" is enabled by default: it would drop the entire schema.
spring.flyway.clean-disabled=true

server.port=${BOOKING_PORT:17103}

# Defensive: devtools is runtime-scoped and is already excluded from the repackaged jar, but
# these lines record the intent for anybody starting from an IDE with the prod profile.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

logging.level.root=WARN
logging.level.com.classroom=INFO
# No file: in a container it would write inside the image, where nobody reads it,
# with no rotation, growing until it fills the layer. The logs go to stdout, which is where
# Docker collects them - "docker compose logs" is already how we read them. The file stays in
# the dev profile, where it is genuinely useful.
# It was also the only one of the four services writing one: the other three already did this.
# The rotation lives in logback-spring.xml, next to the file appender it applies to.
# This had been left behind when logging.file.name was removed from this profile: it
# configured the rotation of a file that does not exist in production.

# WITHOUT a default on purpose: if the variable is unset, startup fails, instead of shipping
# localhost origins to production.
classroom.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
classroom.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
classroom.cors.allowed-headers=*
classroom.cors.allow-credentials=true
classroom.cors.max-age=3600

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# No internal detail in the error responses.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# SecurityConfig does permitAll on /v3/api-docs/** and /swagger-ui/**, and springdoc is
# at compile scope: without these two lines the full API schema would be public in
# production.
#
# Overridable, unlike the rest of this file: docker-compose.yml flips these two to reach
# Swagger through the gateway, WITHOUT switching the whole profile to "dev" - "dev" also
# turns on the file log appender (logback-spring.xml), which has no writable place to go
# inside the container and crashes startup, and the Flyway baseline flags meant for one
# developer's pre-Flyway local database, which have no business running against a
# container's own, always-empty one.
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
