# ============================================================================
# THE DEVELOPMENT PROFILE — THE BOOKING SERVICE
#
#     SPRING_PROFILES_ACTIVE=dev          outside a container
#     SPRING_PROFILES_ACTIVE=dev,docker   what docker-compose.yml sets
#
# The connection, the port and CORS live in application.properties: they already have the
# development values as their fallbacks, and repeating them here would mean keeping them in
# step in two places. What stays here is only what makes sense in development ALONE.
# ============================================================================

# ============================================
# WHAT HIBERNATE IS ACTUALLY DOING
# ============================================
# The base file turns these two OFF - "the technical levels, the same everywhere" - and this
# is the one environment where that is the wrong answer: the whole point of a development run
# is seeing the query that the repository method turned into.
#
# Through the LOGGER and not through spring.jpa.show-sql: show-sql writes straight to
# System.out, with no timestamp, no level and no %X{requestId}, so its lines cannot be tied
# back to the request that produced them - the only reason to be reading them at all.
logging.level.org.hibernate.SQL=DEBUG

# The values bound to the "?" placeholders. In Hibernate 6 this is the logger that receives
# them; the base file's org.hibernate.type.descriptor.sql.BasicBinder is the Hibernate 5
# name, kept there as a leftover, and nothing is sent to it any more.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Statements broken over several lines instead of one long one: it costs nothing here and
# makes the joins in the availability queries readable.
spring.jpa.properties.hibernate.format_sql=true

# INFO/DEBUG and not prod's WARN/INFO. This profile used to declare exactly what prod does,
# so "dev" and "prod" produced the same log and the DEBUG narration - START/END of every
# request, "room 3 is free over the requested period" - was written by the code and printed
# by nobody.
logging.level.root=INFO
logging.level.com.classroom=DEBUG

# ============================================
# ERRORS THAT SAY WHAT WENT WRONG
# ============================================
# The mirror image of prod's three "never": in development the message and the field errors
# belong in the response, where the browser's network tab shows them without a trip to the
# logs. The stack trace only on demand (?trace=true), because it buries everything else.
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# ============================================
# FLYWAY - SETTINGS OF ONE PARTICULAR DATABASE
# ============================================
# The development database existed BEFORE Flyway was introduced, with its tables created by
# Hibernate: baseline marks it at V1 without re-running it.
#
# These are settings of THAT database, not of the application: on a new database they have to
# be false, otherwise a stray table would be enough to have V1 marked as already applied,
# skipping the creation of the anti-overlap constraint.
#
# docker-compose.yml's containers reach this SAME local database now (DB_HOST is
# host.docker.internal, not a container of its own - see docker-compose.yml), so "dev" and
# "dev,docker" are pointed at one database and need one answer. There used to be a second
# file, application-docker.properties, that put this back to false for a container's database
# - which was always empty. It is gone: a fresh local database would still need it set to
# false there, but that is a property of the database you point at, not of "docker" as such.
#
# Overridable, unlike the two lines below it: on a "classroom" database that is NOT the old
# pre-Flyway one - freshly created rather than carried over - V1 has to run for real, so start
# with FLYWAY_BASELINE_ON_MIGRATE=false instead of editing this file.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Schema preesistente creato da Hibernate

# Worth repeating from prod: clean is enabled by default, it drops the entire schema, and
# nothing in this service ever calls it. A profile is not a reason to leave that within reach.
spring.flyway.clean-disabled=true

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# The log file is declared by logback-spring.xml under <springProfile name="dev &amp; !docker">,
# together with its rotation policy: the two belong in the same place. "&amp; !docker" because
# the path is relative and inside a container resolves somewhere unwritable - there the logs
# go to stdout, which is where "docker compose logs" reads them.

# A small pool: in development there is one user.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# In development the frontend bundle changes with every build: a year of caching would be a
# trap, with the browser going on serving the old version.
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.cache-public=false
