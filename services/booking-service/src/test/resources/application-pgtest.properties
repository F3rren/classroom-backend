# ============================================================================
# The profile for the ONLY test class that runs against a real PostgreSQL (Testcontainers).
#
# It lives alongside application-test.properties (H2) without disturbing it: the existing
# integration classes declare @ActiveProfiles("test") and never see this file.
#
# The url, username and password are NOT here: @DynamicPropertySource injects them, reading
# them from the container. That source uses addFirst, so it takes precedence over any
# configuration file, .env included.
# ============================================================================

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# The point of that class: Flyway builds the schema, and Hibernate merely checks that the
# entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CRITICAL. The container's database is empty and has to migrate from V1.
# With baseline-on-migrate=true (the value used in development) a stray table would be enough
# to have V1 marked as already applied: the creation of the exclusion constraint would be
# skipped and the tests would stay green with nothing
# provare nulla.
spring.flyway.baseline-on-migrate=false

spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN

# Keys that are @Value WITHOUT a default in the application: without these the context does
# not start. They are repeated here rather than inherited from the base file, so this profile
# stays valid after the dev/prod split too.
jwt.secret=dGVzdC1zZWNyZXQtbm9uLXVzYXJlLWluLXByb2R1emlvbmUtc29sby1wZXItaS10ZXN0LWF1dG9tYXRpY2k
classroom.cors.allowed-origins=http://localhost:3000
auth.rate-limit.max-attempts=1000
