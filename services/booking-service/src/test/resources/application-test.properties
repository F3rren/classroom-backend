# The test profile: H2 in memory, no dependency on a running Postgres.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# Flyway is off in the tests: the migrations are Postgres-specific (EXCLUDE USING gist, the
# btree_gist extension) and cannot run on H2.
# The test schema stays generated from the entities. A consequence to keep in mind:
# the database constraints are NOT exercised by the integration tests, which is why the
# branches depending on DataIntegrityViolationException are covered by unit tests.
spring.flyway.enabled=false
# No explicit dialect: Hibernate 6 detects H2 from the JDBC connection on its own, and
# naming it by hand is deprecated (HHH90000025).
spring.jpa.show-sql=false

jwt.secret=dGVzdC1zZWNyZXQtcGVyLWktdGVzdC1kaS1pbnRlZ3JhemlvbmUtMDAxMg

classroom.cors.allowed-origins=http://localhost:3000
classroom.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
classroom.cors.allowed-headers=*
classroom.cors.allow-credentials=true
classroom.cors.max-age=3600

logging.level.root=WARN

# The listener stays off in the H2 tests: with no broker it would keep trying to connect,
# filling the logs with errors. Only the class that exercises it turns it back on,
# UserDeletionMessagingTest, against a real broker. Same choice as notification-service.
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
