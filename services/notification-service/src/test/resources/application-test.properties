# ============================================================================
# The test profile of this service.
#
# H2 in memory: fast and sufficient, because this service uses nothing H2 cannot express
# (no exclusion constraint, no range type).
#
# Flyway is off and Hibernate generates the schema: the migrations are written in PostgreSQL
# dialect. It is the same choice the monolith already made.
# ============================================================================

spring.datasource.url=jdbc:h2:mem:notifications;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# It MUST match TestJwt.TEST_SECRET: that is what makes the tokens the tests sign for
# themselves valid here. If the two drift apart, every request answers 401.
jwt.secret=dGVzdC1zZWNyZXQtcGVyLWktdGVzdC1kaS1pbnRlZ3JhemlvbmUtMDAxMg

classroom.cors.allowed-origins=http://localhost:3000
classroom.security.public-paths=/v3/api-docs,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# Emptying the import: the tests bring their own secrets (jwt.secret above) and must not read
# .env, which on a developer's machine holds real values.
spring.config.import=

# The consumer stays off in the H2 tests: with no broker it would keep trying to connect,
# filling the logs with errors. Only the class that exercises it turns it back on,
# CancellationMessagingTest, against a real broker.
spring.rabbitmq.listener.simple.auto-startup=false
