# ============================================================================
# THE NOTIFICATION SERVICE
#
# A database of its own: that is the point of the split. No other service reads or writes the
# notifications table, and this service sees no users, no rooms and no bookings.
# ============================================================================

spring.application.name=Notifiche

server.port=${NOTIFICATION_PORT:17104}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:classroom_notifications}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# The secrets live in .env, the only file that holds them and the only one git ignores:
# Docker Compose reads it for the containers and Spring - from here - for runs outside them.
# "optional:" because in a container the file does not exist, the values arriving as
# environment variables already. The full explanation is in auth-service's copy.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# The bridge between .env's names and Spring's: the conversion is not automatic for keys
# read from a file. jwt.secret MUST hold the same value as in the other services - that is
# what lets this service validate auth-service's tokens on its own, without calling it - and
# it has no fallback on purpose: better not to start than to validate against nothing.
jwt.secret=${JWT_SECRET}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Never update: the schema is Flyway's job, and Hibernate merely checks that the entities
# match, failing at startup if they have drifted.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# This service has no public routes beyond the documentation: it issues no tokens and has no
# login. SecurityConfig's default would be enough, but declaring it makes explicit that the
# omission is not an oversight.
classroom.security.public-paths=/v3/api-docs,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

classroom.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging.level.root=INFO
logging.level.com.classroom=DEBUG

# ============================================================================
# THE BROKER
# The cancellation notification travels on a queue, so it is not lost if the notification
# service is down. The calls where the caller MUST know the outcome stay synchronous, such as
# deleting a user's data.
# ============================================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Behind the gateway the TCP connection comes from the gateway, not from the client: without
# this line getRemoteAddr() always returns the same address and every IP-based defence stops
# telling callers apart. The gateway already sends X-Forwarded-For; "framework" is what tells
# Spring to read it.
#
# Why it really matters: the login limiter's key is IP|email. With a constant IP anybody
# could exhaust the counter for somebody else's address and lock its owner out - six
# anonymous requests were enough. It was a regression introduced by the gateway: before it,
# requests reached the service directly.
#
# TRUSTING X-FORWARDED-FOR TAKES TWO THINGS, AND THIS IS ONLY ONE OF THEM.
#
# The first: the services are not reachable from outside, the only published port is the
# gateway's. If they ever were, this line would become the way to forge your own address.
#
# The second, which was missing: the gateway has to REPLACE the header, not append to it. Its
# default is to append, and since the first value is the one read here, the address was
# chosen by the caller - the login attempt limit was sidestepped by changing it on every
# request. It needs "spring.cloud.gateway.x-forwarded.for-append: false" in the gateway, and
# that is pinned by CallerAddressTest.
#
# The two lines hold each other up: removing one without knowing about the other reopens the
# hole with nothing to signal it.
server.forward-headers-strategy=framework

# A message the listener cannot handle - unreachable database, violated constraint - threw
# an exception, and Spring AMQP's default behaviour requeued it: back in, off again, and so
# on forever.
#
# With retries enabled it is tried three times with growing backoff, and then the
# MessageRecoverer steps in, moves it to the error queue and acknowledges it. The loop closes
# and the message is still somewhere to be looked at.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
