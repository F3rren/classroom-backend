# ============================================================================
# THE PRODUCTION PROFILE — THE NOTIFICATION SERVICE
# This is now also the DEFAULT (see spring.profiles.default in application.properties):
# activating it explicitly with SPRING_PROFILES_ACTIVE=prod is documentation, not a
# requirement. SPRING_PROFILES_ACTIVE=dev is what opts OUT of it.
#
# IT HOLDS HARDENING ONLY. No connection, no port, no secrets:
# those live in application.properties with the ${VAR:default} placeholders, which in
# a container take the real values and outside one fall back to localhost.
#
# The distinction used to matter on the day somebody forgot SPRING_PROFILES_ACTIVE: without
# this profile the service still started, merely less protected - instead of dying for want
# of a URL. Now forgetting it changes nothing, because this is what you get by default.
# booking-service used to be arranged the other way, and the symptom was a 503 from the
# gateway with the cause three files away.
# ============================================================================

# The API documentation is off outside development. It is not reachable from outside anyway
# today - the gateway routes only /api/** and these paths do not sit under it - but the
# protection must not depend on the route table: that changes, and it would change without
# anybody thinking about Swagger again.
#
# Overridable, unlike the rest of this file, and application-dev.properties turns the same
# two round the other way - so which of the pair applies is decided by the profile, not by a
# flag somebody remembered to pass. docker-compose.yml used to set them by hand precisely to
# avoid the "dev" profile, which in a container crashed on the file log appender; that is
# fixed in logback-spring.xml now, and compose says "dev,docker" instead of naming flags.
# These stay overridable for the other case: reading the schema of a running production
# instance, deliberately and temporarily.
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

# No internal detail in the error responses. These match Spring Boot's defaults: declaring
# them is a belt as well as braces, because a default can change between versions and this
# file says what we want, not what happens to be the case.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# A wider pool than development's, and connections that do not hang around forever: a dead
# connection held onto is one slot fewer for everybody else.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# No CORS without a default here, unlike the other two: this service does not talk to the
# browser. Its public routes go through the gateway, and its internal ones are called by other
# services. Demanding a variable nobody needs would be an obstacle, not a
# protezione.

# Never baseline in production: if the database has no Flyway history it has to migrate from
# V1, not be marked as already migrated. And clean is disabled, because dropping the schema
# must not be one command away.
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

logging.level.root=WARN
logging.level.com.classroom=INFO
