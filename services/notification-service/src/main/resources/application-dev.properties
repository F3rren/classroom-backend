# ============================================================================
# THE DEVELOPMENT PROFILE — THE NOTIFICATION SERVICE
#
#     SPRING_PROFILES_ACTIVE=dev          outside a container
#     SPRING_PROFILES_ACTIVE=dev,docker   what docker-compose.yml sets
#
# The mirror image of application-prod.properties: it holds what changes between one
# environment and the other, never what the service needs in order to start. The connection,
# the port and the secrets stay in application.properties with their ${VAR:default}
# placeholders. auth-service's copy of this file explains each block at length; the two say
# the same things because the two services have the same shape.
# ============================================================================

# ============================================
# WHAT HIBERNATE IS ACTUALLY DOING
# ============================================
# Through the logger and not spring.jpa.show-sql, which writes to System.out and so prints
# without the %X{requestId} that ties a statement to the request that caused it.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.com.classroom=DEBUG

# The listener's own narration. This service exists to consume events, and in development the
# question is nearly always "did the message arrive at all" - which is exactly what these two
# answer, and what nothing else does.
logging.level.org.springframework.amqp.rabbit.listener=DEBUG

springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# baseline-on-migrate stays false, as in the base file. clean is worth repeating from prod:
# enabled by default, it drops the whole schema, and nothing here ever calls it.
spring.flyway.clean-disabled=true
