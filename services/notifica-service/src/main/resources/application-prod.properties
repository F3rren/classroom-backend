# ============================================================================
# PROFILO DI PRODUZIONE — SERVIZIO NOTIFICHE
# Attivare con: SPRING_PROFILES_ACTIVE=prod
#
# CONTIENE SOLO IRROBUSTIMENTO. Niente connessione, niente porta, niente segreti:
# quelli stanno in application.properties con i segnaposto ${VAR:default}, che in
# container prendono i valori veri e fuori ripiegano su localhost.
#
# La distinzione conta il giorno in cui qualcuno dimentica SPRING_PROFILES_ACTIVE:
# senza questo profilo il servizio parte lo stesso, solo meno protetto — invece di
# morire per mancanza di un URL. Prenotazione-service aveva l'altro assetto, e il
# sintomo era un 503 dal gateway con la causa tre file piu' in la'.
# ============================================================================

# Documentazione dell'API spenta fuori dallo sviluppo. Oggi non e' raggiungibile
# dall'esterno comunque — il gateway instrada solo /api/** e questi percorsi non ci
# stanno sotto — ma la protezione non deve dipendere dalla tabella delle rotte:
# quella cambia, e cambierebbe senza che nessuno ripensi a Swagger.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Nessun dettaglio interno nelle risposte d'errore. Coincidono con i default di Spring
# Boot: dichiararli e' una cintura in piu', perche' un default puo' cambiare fra due
# versioni e questo file dice cosa vogliamo, non cosa capita.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Un pool piu' largo di quello di sviluppo, e connessioni che non restano appese per
# sempre: una connessione morta trattenuta e' un posto in meno per tutti gli altri.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Niente CORS senza default qui, a differenza degli altri due: questo servizio non parla
# col browser. Le sue rotte pubbliche passano dal gateway, e quelle interne sono chiamate
# da altri servizi. Pretendere una variabile che non serve sarebbe un ostacolo, non una
# protezione.

# Mai baseline in produzione: se il database non ha lo storico di Flyway deve migrare
# dalla V1, non farsi marcare come gia' migrato. E clean disabilitato, perche' una
# cancellazione dello schema non deve essere a un comando di distanza.
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

logging.level.root=WARN
logging.level.com.prenotazioni=INFO
