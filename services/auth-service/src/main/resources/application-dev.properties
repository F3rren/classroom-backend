# ============================================================================
# THE DEVELOPMENT PROFILE — THE USER SERVICE
#
#     SPRING_PROFILES_ACTIVE=dev          outside a container
#     SPRING_PROFILES_ACTIVE=dev,docker   what docker-compose.yml sets
#
# It is the OPPOSITE of application-prod.properties, and it holds the same kinds of settings:
# what changes between one environment and the other, never what the service needs in order
# to start. The connection, the port and the secrets stay in application.properties with
# their ${VAR:default} placeholders, which resolve to the real values in a container and to
# localhost outside one.
#
# This file did not use to exist: "dev" merely meant "prod's hardening never applies", which
# left the visible behaviour of a development run to the base file's defaults. What it adds
# is the part that only makes sense while somebody is watching: the SQL, the reasons inside
# the error responses, a pool sized for one user.
# ============================================================================

# ============================================
# WHAT HIBERNATE IS ACTUALLY DOING
# ============================================
# Through the LOGGER, not through spring.jpa.show-sql. show-sql writes straight to
# System.out: no timestamp, no level, and above all no %X{requestId}, so its lines cannot be
# tied back to the request that produced them - which is the only reason to be reading them.
# On this logger they go through logback like everything else and line up with the rest.
logging.level.org.hibernate.SQL=DEBUG

# The values bound to the "?" placeholders. In Hibernate 6 the logger is this one:
# org.hibernate.type.descriptor.sql.BasicBinder is the Hibernate 5 name and no longer
# receives anything.
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Statements broken over several lines instead of one long one. It costs nothing here and
# makes a join readable; in production nothing prints them at all.
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.com.classroom=DEBUG

# ============================================
# THE DOCUMENTATION
# ============================================
# On in development, which is what prod turns off. Still overridable, so a development run
# can silence it without leaving the profile.
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:true}

# ============================================
# ERRORS THAT SAY WHAT WENT WRONG
# ============================================
# The mirror image of prod's three "never". Here the message and the field errors belong in
# the response: reading them in the browser's network tab is faster than going to look for
# the line in the logs. The stack trace only on demand (?trace=true), because it is long
# enough to bury the rest.
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param

# ============================================
# THE POOL
# ============================================
# Small: in development there is one user. prod's ten open ten connections towards a database
# that, on a laptop, is often shared with other projects.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

# ============================================
# FLYWAY
# ============================================
# baseline-on-migrate stays false, as in the base file: it is prod's rule, but it is also
# right on any database created after Flyway existed - which is every database this service
# has ever had. clean is the one thing worth repeating from prod: it is enabled by default,
# it drops the whole schema, and nothing in this service ever calls it. A profile is not a
# reason to leave that within reach.
spring.flyway.clean-disabled=true
