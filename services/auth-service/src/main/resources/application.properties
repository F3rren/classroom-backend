# ============================================================================
# SERVIZIO UTENTI
#
# Database proprio: e' il punto della separazione. Nessun altro servizio legge o
# scrive la tabella utenti, e questo servizio non vede aule, prenotazioni o notifiche.
# ============================================================================

spring.application.name=Utenti

server.port=${AUTH_PORT:17105}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:prenotazione_aule_utenti}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# I segreti stanno in .env, l'unico file che li contiene e l'unico ignorato da git.
# Lo legge Docker Compose per iniettarli nei container, e lo legge Spring - da qui - per
# i lanci fuori dai container. Il formato KEY=valore di Compose e' anche quello dei file
# .properties di Java, e "[.properties]" e' come lo si dichiara a Spring.
#
# "optional:" non e' pigrizia: in container il file non c'e' affatto, perche' i valori
# arrivano gia' come variabili d'ambiente. Senza "optional:" nessun servizio partirebbe.
#
# I due percorsi coprono il lancio dalla radice e quello da dentro il modulo.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# I nomi non combaciano - .env dice JWT_SECRET, Spring vuole jwt.secret - e la conversione
# NON e' automatica: il relaxed binding tratta le maiuscole con underscore solo per le
# variabili d'ambiente vere, non per le chiavi lette da un file. Questi due sono il ponte,
# e funzionano in entrambi i mondi: in container risolvono la variabile d'ambiente vera,
# in locale il valore letto da .env.
#
# jwt.secret e' deliberatamente senza valore di ripiego: se manca, il servizio deve
# rifiutarsi di partire invece di emettere token firmati con una chiave vuota.
jwt.secret=${JWT_SECRET}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Mai update: lo schema lo fa Flyway, Hibernate si limita a verificare che le entita'
# corrispondano e fallisce all'avvio se divergono.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# Questo servizio non ha rotte pubbliche oltre alla documentazione: non emette token
# e non ha un login. Il default di SecurityConfig basterebbe, ma dichiararlo rende
# esplicito che l'omissione non e' una dimenticanza.
# /api/auth/login deve restare pubblico: e' l'unico modo di ottenere un token.
prenotazioni.security.public-paths=/api/auth/login,/v3/api-docs,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

prenotazioni.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging.level.root=INFO
logging.level.com.prenotazioni=DEBUG

# Indirizzi dei servizi da avvisare quando un utente viene eliminato.
prenotazioni.notifica-service.url=${NOTIFICA_SERVICE_URL:http://localhost:17104}
prenotazioni.prenotazione-service.url=${PRENOTAZIONE_SERVICE_URL:http://localhost:17103}

# Dietro il gateway la connessione TCP arriva dal gateway, non dal client: senza questa
# riga getRemoteAddr() restituisce sempre lo stesso indirizzo e ogni difesa basata sull'IP
# smette di distinguere i chiamanti. Il gateway invia gia' X-Forwarded-For; "framework" e'
# cio' che dice a Spring di leggerlo.
#
# Perche' conta davvero: la chiave del limitatore sui login e' IP|email. Con l'IP costante
# chiunque poteva esaurire il contatore di un indirizzo altrui e tenerne fuori il
# proprietario - sei richieste anonime bastavano. Era una regressione introdotta dal
# gateway: prima le richieste arrivavano al servizio direttamente.
#
# FIDARSI DI X-FORWARDED-FOR RICHIEDE DUE COSE, E QUESTA E' SOLO UNA.
#
# La prima: i servizi non sono raggiungibili da fuori, l'unica porta pubblicata e' quella
# del gateway. Se un giorno lo fossero, questa riga diventerebbe il modo per falsificare il
# proprio indirizzo.
#
# La seconda, che mancava: il gateway deve SOSTITUIRE l'intestazione, non aggiungerla in
# coda. Il suo default e' aggiungere, e siccome qui si legge il primo valore, l'indirizzo
# lo sceglieva chi chiamava - il limite sui tentativi di login si evitava cambiandolo a
# ogni richiesta. Serve "spring.cloud.gateway.x-forwarded.for-append: false" nel gateway,
# ed e' fissato da IndirizzoDelChiamanteTest.
#
# Le due righe si reggono a vicenda: togliendone una senza sapere dell'altra il buco si
# riapre senza che niente lo segnali.
server.forward-headers-strategy=framework
