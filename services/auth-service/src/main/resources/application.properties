# ============================================================================
# THE USER SERVICE
#
# A database of its own: that is the point of the split. No other service reads or writes the
# users table, and this service sees no rooms, no bookings and no notifications.
# ============================================================================

spring.application.name=Utenti

server.port=${AUTH_PORT:17105}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:classroom_users}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# The secrets live in .env, the only file that holds them and the only one git ignores.
# Docker Compose reads it to inject them into the containers, and Spring reads it - from here
# - for runs outside them. Compose's KEY=value format is also that of Java .properties files,
# and "[.properties]" is how you declare that to Spring.
#
# "optional:" is not laziness: in a container the file is not there at all, because the
# values arrive as environment variables already. Without "optional:" no service would start.
#
# The two paths cover launching from the root and from inside the module.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# The names do not line up - .env says JWT_SECRET, Spring wants jwt.secret - and the
# conversion is NOT automatic: relaxed binding treats uppercase-with-underscores only for
# real environment variables, not for keys read from a file. These two are the bridge, and
# they work in both worlds: in a container they resolve the real environment variable, and
# locally the value read from .env.
#
# jwt.secret deliberately has no fallback: if it is missing, the service has to refuse to
# start rather than issue tokens signed with an empty key.
jwt.secret=${JWT_SECRET}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Never update: the schema is Flyway's job, and Hibernate merely checks that the entities
# match, failing at startup if they have drifted.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# /api/auth/login has to stay public: it is the only way to obtain a token. The rest is the
# documentation, and nothing else.
classroom.security.public-paths=/api/auth/login,/v3/api-docs,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

classroom.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

logging.level.root=INFO
logging.level.com.classroom=DEBUG

# The addresses of the services to notify when a user is deleted.
classroom.notification-service.url=${NOTIFICATION_SERVICE_URL:http://localhost:17104}
classroom.booking-service.url=${BOOKING_SERVICE_URL:http://localhost:17103}

# Behind the gateway the TCP connection comes from the gateway, not from the client: without
# this line getRemoteAddr() always returns the same address and every IP-based defence stops
# telling callers apart. The gateway already sends X-Forwarded-For; "framework" is what tells
# Spring to read it.
#
# Why it really matters: the login limiter's key is IP|email. With a constant IP anybody
# could exhaust the counter for somebody else's address and lock its owner out - six
# anonymous requests were enough. It was a regression introduced by the gateway: before it,
# requests reached the service directly.
#
# TRUSTING X-FORWARDED-FOR TAKES TWO THINGS, AND THIS IS ONLY ONE OF THEM.
#
# The first: the services are not reachable from outside, the only published port is the
# gateway's. If they ever were, this line would become the way to forge your own address.
#
# The second, which was missing: the gateway has to REPLACE the header, not append to it. Its
# default is to append, and since the first value is the one read here, the address was
# chosen by the caller - the login attempt limit was sidestepped by changing it on every
# request. It needs "spring.cloud.gateway.x-forwarded.for-append: false" in the gateway, and
# that is pinned by CallerAddressTest.
#
# The two lines hold each other up: removing one without knowing about the other reopens the
# hole with nothing to signal it.
server.forward-headers-strategy=framework
