# ============================================================================
# The test profile of this service.
#
# H2 in memory: fast and sufficient, because this service uses nothing H2 cannot express
# (no exclusion constraint, no range type).
#
# Flyway is off and Hibernate generates the schema: the migrations are written in PostgreSQL
# dialect. It is the same choice the monolith already made.
# ============================================================================

spring.datasource.url=jdbc:h2:mem:users;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
# No explicit dialect: Hibernate 6 detects H2 from the JDBC connection on its own, and
# naming it by hand is deprecated (HHH90000025).
spring.flyway.enabled=false

# It MUST match TestJwt.TEST_SECRET: that is what makes the tokens the tests sign for
# themselves valid here. If the two drift apart, every request answers 401.
jwt.secret=dGVzdC1zZWNyZXQtcGVyLWktdGVzdC1kaS1pbnRlZ3JhemlvbmUtMDAxMg

classroom.cors.allowed-origins=http://localhost:3000
classroom.security.public-paths=/api/auth/login,/v3/api-docs,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# Emptying the import: the tests bring their own secrets (jwt.secret above) and must not read
# .env, which on a developer's machine holds real values.
spring.config.import=

# The threshold is raised: every test's fixture logs in twice from the same address, and the
# anti brute-force rate limiter would count those as suspicious attempts. The real
# limit stays the main configuration's, and is checked separately.
auth.rate-limit.max-attempts=1000
