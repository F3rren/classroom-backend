# ============================================================================
# Profilo per l'UNICA classe di test che gira su PostgreSQL reale (Testcontainers).
#
# Convive con application-test.properties (H2) senza toccarlo: le 9 classi di
# integrazione esistenti dichiarano @ActiveProfiles("test") e non vedono mai
# questo file.
#
# url, username e password NON stanno qui: li inietta @DynamicPropertySource
# leggendoli dal container. Quella sorgente usa addFirst, quindi ha precedenza
# su qualunque file di configurazione, .env compreso.
# ============================================================================

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Il punto di questa classe: lo schema lo costruisce Flyway, e Hibernate deve
# limitarsi a verificare che le entity gli corrispondano.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CRITICO. Il database del container e' vuoto e deve migrare dalla V1.
# Con baseline-on-migrate=true (il valore usato in sviluppo) basterebbe una
# tabella spuria per far marcare la V1 come gia' applicata: si salterebbe la
# creazione del vincolo di esclusione e i test resterebbero verdi senza piu'
# provare nulla.
spring.flyway.baseline-on-migrate=false

spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.org.testcontainers=INFO
logging.level.com.github.dockerjava=WARN

# Chiavi che nell'applicazione sono @Value SENZA default: senza queste il
# contesto non parte. Sono ripetute qui, e non ereditate dal file base, cosi'
# questo profilo resta valido anche dopo lo split dev/prod.
jwt.secret=dGVzdC1zZWNyZXQtbm9uLXVzYXJlLWluLXByb2R1emlvbmUtc29sby1wZXItaS10ZXN0LWF1dG9tYXRpY2k
prenotazioni.cors.allowed-origins=http://localhost:3000
auth.rate-limit.max-attempts=1000
