# ============================================================================
# CONFIGURAZIONE BASE - valida in OGNI ambiente.
#
# Le impostazioni che cambiano fra sviluppo e produzione stanno in
# application-dev.properties e application-prod.properties.
# Il profilo predefinito e' "dev" (vedi in fondo).
# ============================================================================

spring.application.name=Prenotazioni Aule Backend

# Importa i SEGRETI da .env, l'unico file che li contiene e l'unico ignorato da git.
# Lo leggono in due: Docker Compose, per iniettarli nei container, e Spring da qui, per i
# lanci fuori dai container. Prima erano due file distinti con le stesse due chiavi sotto
# nomi diversi, tenuti allineati a mano; quando divergevano il sintomo era un servizio che
# partiva in locale ma non in container, senza che niente dicesse perche'.
#
# Il formato KEY=valore di Compose e' anche quello dei file .properties di Java, e
# "[.properties]" e' come lo si dichiara a Spring. La compatibilita' dei due lettori e'
# fissata da FormatoEnvUnitTest in shared, virgolette comprese.
#
# Resta "optional:" di proposito: in container il file non c'e' affatto, perche' i valori
# arrivano gia' come variabili d'ambiente. Renderlo obbligatorio impedirebbe esattamente
# il modo in cui lo stack gira oggi.
#
# REGOLA: .env contiene SOLO segreti e parametri d'ambiente. Aggiungerci per esempio un
# spring.datasource.url reintrodurrebbe un'ambiguita' di precedenza fra file di
# configurazione difficile da ragionare.
#
# Due percorsi e non uno: con la struttura multi-modulo la working directory cambia a
# seconda di come si avvia. "mvn spring-boot:run -pl prenotazione-service" parte dentro prenotazione-service/, quindi vede
# ../.env; un "java -jar" lanciato dalla radice vede ./.env. Entrambi optional, quindi il
# percorso che non esiste viene semplicemente ignorato.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Il ponte fra i nomi di .env e quelli di Spring. La conversione non e' automatica: il
# relaxed binding tratta le maiuscole con underscore solo per le variabili d'ambiente
# vere, non per le chiavi lette da un file. Questi due segnaposto risolvono in entrambi i
# mondi - la variabile d'ambiente in container, il valore di .env in locale.
#
# jwt.secret e' senza ripiego apposta: se manca, il servizio deve rifiutarsi di partire
# invece di validare token con una chiave vuota.
jwt.secret=${JWT_SECRET}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Percorsi raggiungibili senza token. Prima erano una lista dentro SecurityConfig;
# ora la configurazione di sicurezza e' condivisa fra i servizi e ognuno dichiara i suoi.
prenotazioni.security.public-paths=/api/auth/login,/auth/login,/v3/api-docs,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html

# ============================================
# JPA / HIBERNATE
# ============================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false

# Chiude la sessione al termine del service invece di tenerla aperta durante la
# serializzazione della risposta.
spring.jpa.open-in-view=false

# INVARIANTE: mai "update", in nessun profilo. Lo schema e' di competenza di Flyway;
# Hibernate si limita a verificare che le entity corrispondano alle tabelle.
spring.jpa.hibernate.ddl-auto=validate

# ============================================
# MIGRAZIONI SCHEMA (Flyway)
# ============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Le baseline-* NON stanno qui: sono una proprieta' del singolo database, non
# dell'applicazione. Vedi application-dev.properties.

# ============================================
# LOG (livelli tecnici, uguali ovunque)
# ============================================
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.type=OFF
logging.level.org.springframework.transaction=WARN

# ============================================
# ENCODING E RISORSE STATICHE
# ============================================
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ============================================
# PROFILO PREDEFINITO
# ============================================
# Cosi' "mvn spring-boot:run" e "java -jar" continuano a funzionare come prima.
# La produzione attiva esplicitamente: SPRING_PROFILES_ACTIVE=prod
#
# ATTENZIONE: un futuro @SpringBootTest scritto SENZA @ActiveProfiles erediterebbe
# "dev" e punterebbe al database locale dello sviluppatore. Oggi non puo' accadere:
# tutte le classi di test dichiarano il proprio profilo.
spring.profiles.default=dev

# ============================================================================
# BROKER
# La notifica di cancellazione viaggia su coda: cosi' non si perde se il servizio
# notifiche e' spento. Restano sincrone le chiamate in cui il chiamante DEVE
# sapere l'esito, come la cancellazione dei dati di un utente.
# ============================================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
