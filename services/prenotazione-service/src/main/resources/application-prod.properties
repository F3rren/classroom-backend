# ============================================================================
# PROFILO DI PRODUZIONE
# Attivare con: SPRING_PROFILES_ACTIVE=prod
# ============================================================================

# Connessione da variabili d'ambiente, con default utilizzabili.
# La connessione NON e' dichiarata qui: sta in application.properties con i segnaposto
# ${DB_HOST} e compagni, che in container prendono i valori veri e fuori ripiegano su
# localhost. Ripeterla qui vorrebbe dire tenerla allineata in due file.
#
# QUESTO PROFILO CONTIENE SOLO IRROBUSTIMENTO: cose che devono cambiare fuori dallo
# sviluppo, non cose senza le quali il servizio non parte. E' una distinzione che si paga
# quando qualcuno dimentica SPRING_PROFILES_ACTIVE: senza il profilo il servizio parte lo
# stesso, solo meno protetto - invece di morire.

# Nessuna baseline in produzione: se il database non ha lo storico di Flyway deve
# migrare dalla V1, non farsi marcare come gia' migrato.
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
# In Flyway 9 "clean" e' abilitato per default: cancellerebbe l'intero schema.
spring.flyway.clean-disabled=true

server.port=${PRENOTAZIONE_PORT:17103}

# Difensivo: devtools e' a scope runtime e viene gia' escluso dal jar ripacchettato,
# ma queste righe documentano l'intento per chi avvia da IDE con profilo prod.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

logging.level.root=WARN
logging.level.com.prenotazioni=INFO
# Niente file: in container ci scriverebbe dentro l'immagine, dove nessuno lo legge,
# senza rotazione e crescendo finche' non riempie il layer. I log vanno su stdout, che
# e' dove Docker li raccoglie - "docker compose logs" e' gia' come li leggiamo. Il file
# resta nel profilo dev, dove serve davvero.
# Era anche l'unico servizio su quattro a scriverlo: gli altri tre erano gia' cosi'.
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# SENZA default di proposito: se la variabile non e' impostata l'avvio fallisce,
# invece di spedire in produzione le origini di localhost.
prenotazioni.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
prenotazioni.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
prenotazioni.cors.allowed-headers=*
prenotazioni.cors.allow-credentials=true
prenotazioni.cors.max-age=3600

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Nessun dettaglio interno nelle risposte di errore.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# SecurityConfig fa permitAll su /v3/api-docs/** e /swagger-ui/**, e springdoc e'
# a scope compile: senza queste due righe lo schema completo dell'API sarebbe
# pubblico in produzione.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true
